name: Sync release secrets

# On-demand copy of the release-signing secrets to sibling repos that publish
# the same packages (laya-rs, locate-anything-rs, julia1-rs, opendlss-rs,
# phonon-rs and merge-safetensors-rs). Run manually after adding or
# rotating any of these secrets so both repos stay in sync.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without writing secrets"
        type: boolean
        default: true

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: jpoehnelt/secrets-sync-action@7840777f242539d96b60477b66aa1c179e7644ea # v1.10.0
        with:
          SECRETS: |
            ^APT_GPG_PASSPHRASE$
            ^APT_GPG_PRIVATE_KEY$
            ^APT_REPO_TOKEN$
            ^CARGO_REGISTRY_TOKEN$
            ^HOMEBREW_TAP_TOKEN$
            ^PACMAN_GPG_PASSPHRASE$
            ^PACMAN_GPG_PRIVATE_KEY$
            ^PACMAN_REPO_TOKEN$
          REPOSITORIES: |
            ^apiplant/laya-rs$
            ^apiplant/locate-anything-rs$
            ^apiplant/julia1-rs$
            ^apiplant/opendlss-rs$
            ^apiplant/phonon-rs$
            ^apiplant/merge-safetensors-rs$
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.SECRETS_SYNC_TOKEN }}
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_REPO_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          PACMAN_GPG_PASSPHRASE: ${{ secrets.PACMAN_GPG_PASSPHRASE }}
          PACMAN_GPG_PRIVATE_KEY: ${{ secrets.PACMAN_GPG_PRIVATE_KEY }}
          PACMAN_REPO_TOKEN: ${{ secrets.PACMAN_REPO_TOKEN }}
