[package]
name = "gliner-rs"
version = "0.2.1"
edition = "2021"
description = "Rust (candle) inference for GLiNER2 boundary-architecture checkpoints (e.g. fastino/gliner2.5-multi-v1)"
license = "Apache-2.0"
repository = "https://github.com/apiplant/gliner-rs"
readme = "README.md"
keywords = ["gliner", "ner", "nlp", "candle", "inference"]
categories = ["science", "text-processing", "command-line-utilities"]

[lib]
name = "gliner_rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "gliner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustyline = { version = "18", features = ["with-file-history", "derive"] }
ureq = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
